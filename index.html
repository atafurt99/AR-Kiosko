<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Experiencia AR - Kiosko Interactivo</title>
    
    <style>
        /* =========================================
           ESTILOS GENERALES Y UI
           ========================================= */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* PANTALLA DE CARGA */
        #loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #081292;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            flex-direction: column;
            text-align: center;
        }

        #loading img {
            max-width: 250px;
            margin-bottom: 30px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* BOTÓN DE INICIO */
        #startButton {
            padding: 15px 30px;
            font-size: 18px;
            background-color: white;
            color: #201f1f;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 1000;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        
        #startButton:active {
            transform: scale(0.95);
        }

        .video-resource {
            display: none;
        }
    </style>

    <!-- SEGURIDAD HTTPS -->
    <script>
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            location.replace(`https:${location.href.substring(location.protocol.length)}`);
        }
    </script>
    
    <!-- IMPORT MAPS -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>
</head>
<body>
    <!-- UI -->
    <div id="loading">
        <img src="./assets/CB.png" alt="Logo Corporativo">
        <button id="startButton">Iniciar Experiencia</button>
    </div>

    <!-- RECURSOS -->
    <video id="video-normal" class="video-resource" loop muted playsinline webkit-playsinline crossorigin="anonymous">
        <source src="assets/Perro.mp4" type="video/mp4">
    </video>

    <video id="video-alpha" class="video-resource" loop muted playsinline webkit-playsinline crossorigin="anonymous">
        <source src="./assets/Elphant_animation.mp4" type="video/quicktime">
        <source src="./assets/Elphant_animation.mp4" type="video/webm">
    </video>

    <!-- APP -->
    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        document.addEventListener('DOMContentLoaded', () => {
            const startButton = document.getElementById('startButton');
            const loadingScreen = document.getElementById('loading');
            
            const interactables = []; 
            const balloons = [];      

            const unlockAudio = () => {
                const ctx = THREE.AudioContext.getContext();
                if (ctx.state === 'suspended') ctx.resume();
                const buffer = ctx.createBuffer(1, 1, 22050);
                const source = ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(ctx.destination);
                source.start(0);
                console.log("🔊 Sistema de audio desbloqueado.");
            };

            const startAR = async () => {
                startButton.style.display = 'none';
                
                const v1 = document.getElementById("video-normal");
                const v2 = document.getElementById("video-alpha");
                try {
                    await v1.play(); v1.pause();
                    await v2.play(); v2.pause();
                } catch (e) { console.warn("Autoplay preventivo:", e); }

                // =========================================================================
                // CONFIGURACIÓN MAESTRA DE TRACKING
                // Ajusta estos valores para cambiar la sensación de la experiencia
                // =========================================================================
                const TRACKING_CONFIG = {
                    // filterMinCF (0.0001 - 1.0): Estabilidad Estática. 
                    // Menor = Menos temblor cuando estás quieto (pero puede sentirse "pesado").
                    filterMinCF: 0.0001, 

                    // filterBeta (0.001 - 1000): Velocidad de Reacción.
                    // Aumentar esto (ej. 10 o 100) reduce el "lag" al mover la cámara, pero aumenta el temblor.
                    // Lo he subido ligeramente de 0.001 a 0.01 para que no se sienta tan "lento".
                    filterBeta: 0.03,

                    // missTolerance (1 - 100): "Pegamento".
                    // Cuántos cuadros espera antes de ocultar el objeto si pierde el marcador.
                    // Valor alto (20) hace que el objeto se quede "congelado" un momento si tapas la cámara,
                    // en lugar de desaparecer instantáneamente.
                    missTolerance: 15, 

                    // warmupTolerance (1 - 100): Calidad Inicial.
                    // Cuántos cuadros perfectos necesita al inicio para mostrarse.
                    warmupTolerance: 13,
                };
                // =========================================================================

                const mindarThree = new MindARThree({
                    container: document.body,
                    imageTargetSrc: './assets/marcador.mind',
                    
                    // Aplicando configuración maestra
                    filterMinCF: TRACKING_CONFIG.filterMinCF,
                    filterBeta: TRACKING_CONFIG.filterBeta,
                    missTolerance: TRACKING_CONFIG.missTolerance,
                    warmupTolerance: TRACKING_CONFIG.warmupTolerance,
                    
                    maxTrack: 1 
                });

                const {renderer, scene, camera} = mindarThree;

                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.autoClear = true;

                const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
                scene.add(light);

                const listener = new THREE.AudioListener();
                camera.add(listener);

                // --- TARGET 0 ---
                const anchor0 = mindarThree.addAnchor(1);
                const setupTarget0 = () => {
                    const video = document.getElementById("video-normal");
                    const texture = new THREE.VideoTexture(video);
                    const plane = new THREE.Mesh(
                        new THREE.PlaneGeometry(1, 1), 
                        new THREE.MeshBasicMaterial({ map: texture })
                    );
                    plane.scale.set(1, 1.6, 1);
                    anchor0.group.add(plane);
                    
                    anchor0.onTargetFound = () => video.play();
                    anchor0.onTargetLost = () => video.pause();
                };
                setupTarget0();

                // --- TARGET 1 ---
                const anchor1 = mindarThree.addAnchor(1);
                const setupTarget1 = () => {
                    const loader = new GLTFLoader();
                    loader.load('./assets/2026.glb', (glb) => {
                        const model = glb.scene;
                        model.scale.set(0.8, 0.8, 0.8);
                        model.position.set(-1.1, 0, 0);
                        model.rotation.set(Math.PI / 2, 0, 0);
                        const mixer = new THREE.AnimationMixer(model);
                        if(glb.animations.length > 0) mixer.clipAction(glb.animations[0]).play();
                        anchor1.mixer = mixer; 
                        anchor1.group.add(model);
                    });
                };
                setupTarget1();

                // --- TARGET 2 ---
                const anchor2 = mindarThree.addAnchor(2);
                const setupTarget2 = () => {
                    const plane = new THREE.Mesh(
                        new THREE.PlaneGeometry(1, 1),
                        new THREE.MeshBasicMaterial({ color: 0x0000ff, transparent: true, opacity: 0.3 })
                    );
                    anchor2.group.add(plane);

                    const sound = new THREE.PositionalAudio(listener);
                    const audioLoader = new THREE.AudioLoader();
                    let isTargetVisible = false;

                    audioLoader.load('./assets/Espacial.mp3', function(buffer) {
                        sound.setBuffer(buffer);
                        sound.setRefDistance(30);
                        sound.setLoop(true);
                        sound.setVolume(60.0); 
                        if (isTargetVisible && !sound.isPlaying && buffer) sound.play();
                    }, undefined, (err) => console.error("Error Audio 2:", err));
                    plane.add(sound);

                    // Botón
                    const canvas = document.createElement('canvas');
                    canvas.width = 512; canvas.height = 128;
                    const context = canvas.getContext('2d');
                    context.fillStyle = '#FF0000'; context.fillRect(0, 0, 512, 128);
                    context.font = 'bold 60px Arial'; context.fillStyle = 'white'; 
                    context.textAlign = 'center'; context.textBaseline = 'middle';
                    context.fillText("IR A YOUTUBE", 256, 64);

                    const buttonMesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.8, 0.2), 
                        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) })
                    );
                    buttonMesh.position.set(0, -0.6, 0.1); 
                    buttonMesh.userData = { type: 'link', url: 'https://www.youtube.com' };

                    anchor2.group.add(buttonMesh);
                    interactables.push(buttonMesh);

                    anchor2.onTargetFound = () => { 
                        isTargetVisible = true;
                        if(sound.buffer && !sound.isPlaying) sound.play(); 
                    };
                    anchor2.onTargetLost = () => { 
                        isTargetVisible = false;
                        if(sound.isPlaying) sound.pause(); 
                    };
                };
                setupTarget2();

                // --- TARGET 3 ---
                const anchor3 = mindarThree.addAnchor(0);
                const setupTarget3 = () => {
                    const video = document.getElementById("video-alpha");
                    const texture = new THREE.VideoTexture(video);
                    texture.format = THREE.RGBAFormat;
                    
                    const material = new THREE.ShaderMaterial({
                        transparent: true,
                        uniforms: { textureMap: { value: texture } },
                        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`,
                        fragmentShader: `uniform sampler2D textureMap; varying vec2 vUv; void main() { vec4 videoColor = texture2D(textureMap, vUv); gl_FragColor = videoColor; }`,
                        side: THREE.DoubleSide, depthWrite: false
                    });
                    
                    const plane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
                    plane.scale.set(1.0, 0.64, 1);
                    anchor3.group.add(plane);

                    // Globos
                    const balloonCount = 30;
                    const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xffa500];
                    const textureLoader = new THREE.TextureLoader();
                    textureLoader.load('./assets/globo.png', (balloonTex) => {
                        for (let i = 0; i < balloonCount; i++) {
                            const mat = new THREE.SpriteMaterial({ 
                                map: balloonTex, color: colors[Math.floor(Math.random() * colors.length)], 
                                transparent: true, blending: THREE.AdditiveBlending, opacity: 0.9
                            });
                            const sprite = new THREE.Sprite(mat);
                            sprite.position.set((Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 2 - 1, (Math.random() - 0.5) * 7 - 0.2);
                            const scale = 0.05 + Math.random() * 0.1;
                            sprite.scale.set(scale, 0.1+scale, 1); 
                            sprite.userData = { speed: 0.005 + Math.random() * 0.01, wobbleOffset: Math.random() * Math.PI * 2, initialX: sprite.position.x };
                            anchor3.group.add(sprite);
                            balloons.push(sprite);
                        }
                    });

                    // Oclusión
                    const occlusionMesh = new THREE.Mesh(
                        new THREE.BoxGeometry(1, 1.5, 0.1), 
                        new THREE.MeshBasicMaterial({ colorWrite: false })
                    );
                    occlusionMesh.position.set(0, 0, -0.2); 
                    occlusionMesh.renderOrder = -1;
                    anchor3.group.add(occlusionMesh);

                    // Audio
                    const sound = new THREE.PositionalAudio(listener);
                    const audioLoader = new THREE.AudioLoader();
                    let isTargetVisible = false;
                    audioLoader.load('./assets/Espacial.mp3', function(buffer) {
                        sound.setBuffer(buffer);
                        sound.setRefDistance(30);
                        sound.setLoop(true);
                        sound.setVolume(60.0);
                        if (isTargetVisible && !sound.isPlaying && buffer) sound.play();
                    }, undefined, (err) => console.error("Error Audio 3:", err));
                    plane.add(sound);

                    anchor3.onTargetFound = () => { isTargetVisible = true; video.play(); if(sound.buffer && !sound.isPlaying) sound.play(); };
                    anchor3.onTargetLost = () => { isTargetVisible = false; video.pause(); if(sound.isPlaying) sound.pause(); };
                };
               setupTarget3();

                // Interacción
                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2();
                window.addEventListener('touchstart', (event) => {
                    mouse.x = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(interactables);
                    if (intersects.length > 0) {
                        const obj = intersects[0].object;
                        if (obj.userData.type === 'link') window.open(obj.userData.url, '_blank');
                    }
                });

                // Inicio
                try {
                    await mindarThree.start();
                    loadingScreen.style.display = 'none'; 
                } catch (err) {
                    console.error(err);
                    const errorDiv = document.createElement('div');
                    errorDiv.style.color = 'red';
                    errorDiv.innerText = "Error: " + err.message;
                    loadingScreen.appendChild(errorDiv);
                }

                // Loop
                const clock = new THREE.Clock();
                renderer.setAnimationLoop(() => {
                    const delta = clock.getDelta();
                    const elapsed = clock.getElapsedTime();
                    if (anchor1.mixer) anchor1.mixer.update(delta);
                    balloons.forEach(balloon => {
                        balloon.position.y += balloon.userData.speed;
                        balloon.position.x = balloon.userData.initialX + Math.sin(elapsed * 2 + balloon.userData.wobbleOffset) * 0.4;
                        if (balloon.position.y > 1.5) {
                            balloon.position.y = -1.5;
                            balloon.userData.initialX = (Math.random() - 0.5) * 1.5;
                        }
                    });
                    renderer.render(scene, camera);
                });
            };

            startButton.addEventListener('click', () => { unlockAudio(); startAR(); });
        });
    </script>
</body>
</html>
