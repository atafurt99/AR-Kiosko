<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Experiencia AR - Kiosko Interactivo</title>
    
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Segoe UI', sans-serif;
        }

        #ar-container {
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; z-index: 1;
        }

        #ar-container video, #ar-container canvas {
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            object-fit: cover !important;
        }
        
        #ar-container canvas { z-index: 2 !important; }
        #ar-container video { z-index: 1 !important; }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #081292; color: white;
            display: flex; justify-content: center; align-items: center;
            z-index: 999; flex-direction: column; text-align: center;
        }

        #loading img { max-width: 250px; margin-bottom: 30px; animation: pulse 2s infinite; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        #startButton {
            padding: 15px 30px; font-size: 18px; background: white;
            border: none; border-radius: 50px; cursor: pointer; color: #081292;
            font-weight: bold; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .video-resource { display: none !important; }
    </style>
    
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>
</head>
<body>
    <div id="ar-container"></div>

    <div id="loading">
        <img src="./assets/CB.png" alt="Logo" onerror="this.style.display='none'">
        <button id="startButton">Iniciar Experiencia</button>
    </div>

    <video id="video-alpha" class="video-resource" loop muted playsinline crossorigin="anonymous" preload="metadata">
        <source src="./assets/Elphant_animation.mp4" type="video/mp4">
    </video>

    <video id="video-normal" class="video-resource" loop muted playsinline crossorigin="anonymous" preload="metadata">
        <source src="./assets/Perro.mp4" type="video/mp4">
    </video>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        // Helper de rutas original intacto
        const getAssetPath = (path) => {
            try {
                if (path.startsWith('http')) return path;
                const cleanPath = path.startsWith('./') ? path.substring(2) : path;
                return new URL(cleanPath, window.location.href).href;
            } catch (e) { return path; }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const startButton = document.getElementById('startButton');
            const loadingScreen = document.getElementById('loading');
            const arContainer = document.getElementById('ar-container');
            
            const interactables = []; 
            const balloons = [];      
            const mixers = []; // Restaurado por si lo necesitas a futuro

            const TARGETS_CONFIG = [
                {
                    targetIndex: 0,
                    videoId: 'video-alpha',
                    planeWidth: 1,
                    planeHeight: 0.64,
                    hasBalloons: true,
                    audioSrc: null,
                    buttonUrl: null
                },
                {
                    targetIndex: 1,
                    videoId: 'video-alpha',
                    planeWidth: 1,
                    planeHeight: 0.64,  
                    hasBalloons: false,
                    audioSrc: null,
                    buttonUrl: null
                },
                 {
                    targetIndex: 2,
                    videoId: 'video-alpha',
                    planeWidth: 1,
                    planeHeight: 0.64,
                    hasBalloons: false,
                    audioSrc: null,
                    buttonUrl: null
                },
                {
                    targetIndex: 3,
                    videoId: 'video-alpha',
                    planeWidth: 1,
                    planeHeight: 0.64,
                    hasBalloons: false,
                    audioSrc: null,
                    buttonUrl: null
                },
                 {
                    targetIndex: 4,
                    videoId: 'video-alpha',
                    planeWidth: 1,
                    planeHeight: 0.64,
                    hasBalloons: false,
                    audioSrc: null,
                    buttonUrl: null
                }
            ];

            const unlockAudio = () => {
                const ctx = THREE.AudioContext.getContext();
                if (ctx.state === 'suspended') ctx.resume();
            };

            const startAR = async () => {
                startButton.style.display = 'none';

                const mindarThree = new MindARThree({
                    container: arContainer,
                    imageTargetSrc: getAssetPath('assets/targets.mind'),
                    maxTrack: 1 
                });

                const {renderer, scene, camera} = mindarThree;
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setClearColor(0x000000, 0); 

                const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
                scene.add(light);

                const listener = new THREE.AudioListener();
                camera.add(listener);

                // Función original restaurada
                const addOccluder = (group, w, h, d, z) => {
                    const occMesh = new THREE.Mesh(
                        new THREE.BoxGeometry(w, h, d),
                        new THREE.MeshBasicMaterial({ colorWrite: false })
                    );
                    occMesh.position.set(0, 0, z);
                    occMesh.renderOrder = -1;
                    group.add(occMesh);
                };

                // CACHÉ DE RECURSOS
                const videoCache = {};
                const textureLoader = new THREE.TextureLoader();
                const sharedBalloonTexture = textureLoader.load(getAssetPath('assets/fondo inserto high school.png'));

                TARGETS_CONFIG.forEach(config => {
                    const anchor = mindarThree.addAnchor(config.targetIndex);
                    
                    let videoElement = null;
                    let sound = null;

                    // 1. Configurar Video
                    if (config.videoId) {
                        if (!videoCache[config.videoId]) {
                            const el = document.getElementById(config.videoId);
                            videoCache[config.videoId] = {
                                element: el,
                                material: new THREE.MeshBasicMaterial({ 
                                    map: new THREE.VideoTexture(el), 
                                    transparent: true, 
                                    side: THREE.DoubleSide 
                                })
                            };
                        }
                        
                        videoElement = videoCache[config.videoId].element;
                        const plane = new THREE.Mesh(
                            new THREE.PlaneGeometry(config.planeWidth, config.planeHeight), 
                            videoCache[config.videoId].material
                        );
                        anchor.group.add(plane);
                    }

                    // 2. Configurar Globos
                    if (config.hasBalloons) {
                        for (let i = 0; i < 15; i++) {
                            const mat = new THREE.SpriteMaterial({ map: sharedBalloonTexture, color: Math.random() * 0xffffff, transparent: true, opacity: 0.8 });
                            const sprite = new THREE.Sprite(mat);
                            sprite.position.set((Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 0.5);
                            const scale = 0.05 + Math.random() * 0.1;
                            sprite.scale.set(scale, scale * 1.2, 1); 
                            sprite.userData = { speed: 0.005 + Math.random() * 0.01, offset: Math.random() * 10 };
                            anchor.group.add(sprite);
                            balloons.push(sprite);
                        }
                    }

                    // 3. Configurar Botón
                    let button = null;
                    if (config.buttonUrl) {
                        const btnMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
                        button = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.25), btnMat);
                        button.position.set(0, -0.4, 0.1);
                        button.userData = { url: config.buttonUrl };
                        interactables.push(button);
                        anchor.group.add(button);
                    }

                    // 4. Configurar Audio
                    if (config.audioSrc) {
                        sound = new THREE.PositionalAudio(listener);
                        new THREE.AudioLoader().load(getAssetPath(config.audioSrc), (buffer) => {
                            sound.setBuffer(buffer);
                            sound.setRefDistance(20);
                            sound.setLoop(true);
                        });
                        if (button) button.add(sound);
                        else anchor.group.add(sound);
                    }

                    // 5. Reproducción
                    anchor.onTargetFound = () => { 
                        if (videoElement) videoElement.play();
                        if (sound && sound.buffer) sound.play(); 
                    };
                    
                    // 6. Pausar
                    anchor.onTargetLost = () => { 
                        if (videoElement) videoElement.pause();
                        if (sound && sound.isPlaying) sound.pause(); 
                    };
                });

                try {
                    await mindarThree.start();
                    loadingScreen.style.display = 'none'; 
                } catch (err) {
                    alert("Error en cámara: " + err.message);
                }

                const clock = new THREE.Clock();
                renderer.setAnimationLoop(() => {
                    const elapsed = clock.getElapsedTime();
                    
                    balloons.forEach(b => {
                        b.position.y += b.userData.speed;
                        b.position.x += Math.sin(elapsed + b.userData.offset) * 0.002;
                        if (b.position.y > 1) b.position.y = -1;
                    });
                    
                    renderer.render(scene, camera);
                });

                window.addEventListener('touchstart', (e) => {
                    const mouse = new THREE.Vector2();
                    mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(interactables);
                    if (intersects.length > 0 && intersects[0].object.userData.url) {
                        window.open(intersects[0].object.userData.url, '_blank');
                    }
                });
            };

            startButton.addEventListener('click', () => { 
                unlockAudio(); 

                // TRUCO: Desbloqueo nativo de videos para evitar pantallas negras en móviles
                document.querySelectorAll('.video-resource').forEach(vid => {
                    vid.play().then(() => { vid.pause(); }).catch(e => console.log("Unlock pendiente:", e));
                });

                startAR(); 
            });
        });
    </script>
</body>
</html>
